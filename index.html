<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pipo y la Torre Luz</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0f1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f1f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16/9; image-rendering: auto; background: #6ec6ff; touch-action: none; }
  .pad { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); display: none; gap: 14px; }
  #padL { left: max(14px, env(safe-area-inset-left)); }
  #padR { right: max(14px, env(safe-area-inset-right)); }
  .btn { width: 76px; height: 76px; border-radius: 50%; background: rgba(255,255,255,.25); border: 2px solid rgba(255,255,255,.65);
         color: #fff; font: bold 32px Arial, sans-serif; display: flex; align-items: center; justify-content: center;
         touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; backdrop-filter: blur(2px); }
  .btn.on { background: rgba(127,243,255,.55); }
  #bj { width: 92px; height: 92px; font-size: 17px; letter-spacing: 1px; }
  @media (pointer: coarse) { .pad { display: flex; } }
  #mus { position: fixed; top: max(44px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 40px; height: 40px; border-radius: 50%; background: rgba(10,20,40,.55); border: 2px solid rgba(255,255,255,.55); color: #fff; font: bold 20px Arial, sans-serif; display: flex; align-items: center; justify-content: center; z-index: 4; touch-action: none; -webkit-user-select: none; user-select: none; }
  #rot { position: fixed; inset: 0; background: rgba(8,14,34,.92); color: #fff; font: bold 22px Arial, sans-serif; display: none;
         align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 5; }
  @media (orientation: portrait) and (pointer: coarse) { #rot { display: flex; } }

  /* ---- Modo Torre 3D ---- */
  #stage3d { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #000; z-index: 10; }
  #stage3dInner { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16/9; overflow: hidden; }
  #three3d { position: absolute; inset: 0; }
  #three3d canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
  #hud3d { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start;
           font: bold 14px Arial, sans-serif; color: #eaf6ff; text-shadow: 0 2px 4px rgba(0,0,0,.6); z-index: 3; }
  #hud3d .tag3d { background: rgba(10,16,34,.72); padding: 6px 14px; border-radius: 999px; pointer-events: none; }
  #menu3dBtn { pointer-events: auto; cursor: pointer; background: rgba(255,214,102,.85); color: #2a1800; }
  #msg3d { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); color: #eaf6ff; font: bold 16px Arial, sans-serif;
           text-shadow: 0 2px 4px rgba(0,0,0,.6); z-index: 3; pointer-events: none; background: rgba(10,16,34,.72);
           padding: 6px 16px; border-radius: 999px; opacity: 0; transition: opacity .3s; }
  #msg3d.show { opacity: 1; }
  #stick3d { position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); left: max(16px, env(safe-area-inset-left));
             width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.4);
             z-index: 4; touch-action: none; }
  #knob3d { position: absolute; width: 46%; height: 46%; left: 27%; top: 27%; border-radius: 50%; background: rgba(127,243,255,.55); pointer-events: none; }
  #padR3d { position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); right: max(16px, env(safe-area-inset-right)); display: flex; gap: 14px; z-index: 4; }
  .btn3d { width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(255,255,255,.65); color: #fff;
           font: bold 13px Arial, sans-serif; display: flex; align-items: center; justify-content: center; text-align: center;
           -webkit-user-select: none; user-select: none; touch-action: none; }
  #jumpBtn3d { background: rgba(127,243,255,.3); }
  #laserBtn3d { background: rgba(255,77,109,.3); }
  #dashBtn3d { background: rgba(255,214,102,.3); transition: opacity .2s; }
  .btn3d.on { filter: brightness(1.6); }
  #coin3d { background: rgba(10,16,34,.72); padding: 6px 14px; border-radius: 999px; pointer-events: none; color: #ffe14d; }
  #pu3d { position: absolute; top: 46px; left: 14px; right: 14px; text-align: left; font: bold 12px Arial, sans-serif;
          color: #eaf6ff; text-shadow: 0 2px 4px rgba(0,0,0,.6); z-index: 3; pointer-events: none; }
  #bossBar3d { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 46%; max-width: 420px;
               height: 14px; border: 2px solid rgba(255,255,255,.6); border-radius: 999px; overflow: hidden;
               background: rgba(10,16,34,.6); z-index: 3; display: none; }
  #bossBarFill3d { height: 100%; width: 100%; background: linear-gradient(90deg,#ff2e5b,#ff8a3d); transition: width .2s; }
</style>
</head>
<body>
<canvas id="c" width="800" height="450"></canvas>
<div class="pad" id="padL"><div class="btn" id="bl">&#9664;</div><div class="btn" id="br">&#9654;</div></div>
<div class="pad" id="padR"><div class="btn" id="bj">SALTAR</div></div>
<div id="mus" title="Música (M)">♪</div>
<div id="rot">Gira el celular en horizontal para jugar</div>

<div id="stage3d">
  <div id="stage3dInner">
    <div id="three3d"></div>
    <div id="hud3d">
      <span class="tag3d" id="coin3d">◆ 0/0</span>
      <span class="tag3d" id="menu3dBtn">MENÚ</span>
    </div>
    <div id="bossBar3d"><div id="bossBarFill3d"></div></div>
    <div id="pu3d"></div>
    <div id="msg3d"></div>
    <div id="stick3d"><div id="knob3d"></div></div>
    <div id="padR3d">
      <div class="btn3d" id="dashBtn3d">DASH</div>
      <div class="btn3d" id="laserBtn3d">LÁSER</div>
      <div class="btn3d" id="jumpBtn3d">SALTAR</div>
    </div>
  </div>
</div>

<script>
"use strict";
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const W = 800, H = 450, GY = 370, TOTAL = 10;
const SPEED = 280, SPRINT = 1.65, GRAV = 1700, JUMP = 640;

/* ---------- Temas por nivel ---------- */
const NEWMON = {4: "Nuevo: monstruo verde que salta", 5: "Nuevo: monstruo rojo con pinchos (¡no lo pises!)", 6: "Nuevo: murciélago volador", 7: "Nuevo: monstruo naranja que embiste", 10: "¡El Guardián bloquea la salida! Salta 3 veces sobre su cabeza (esquiva las piedras)"};
const NAMES = ["El Valle", "Las Colinas", "Atardecer", "Crepúsculo", "Noche Larga", "Hielo", "Volcán", "El Abismo", "Tormenta", "La Torre Final"];
const THEMES = [
  {s1: "#4fa8ff", s2: "#bfe8ff", h1: "#7ac9a0", h2: "#4ea87a", top: "#4cc152", hi: "#6fe070", dirt: "#8a5a35", dirt2: "#6f4627", sun: "#fff6b0", cloud: "rgba(255,255,255,.85)"},
  {s1: "#5b8cff", s2: "#ffe7b8", h1: "#8fcf8a", h2: "#5fae6a", top: "#58c04c", hi: "#7be26a", dirt: "#8a5a35", dirt2: "#6f4627", sun: "#fff0a0", cloud: "rgba(255,255,255,.85)"},
  {s1: "#ff7b54", s2: "#ffd194", h1: "#c0728a", h2: "#8a4f73", top: "#9ac34a", hi: "#b9de63", dirt: "#7a4a3a", dirt2: "#5e382c", sun: "#fff2c0", cloud: "rgba(255,230,210,.8)"},
  {s1: "#3b2a6e", s2: "#d4739a", h1: "#6d4a8f", h2: "#4a3270", top: "#7aa84a", hi: "#98c860", dirt: "#5a3b50", dirt2: "#452c3f", sun: "#ffe0b0", cloud: "rgba(255,200,220,.55)"},
  {s1: "#070c2a", s2: "#2b3a7a", h1: "#23306a", h2: "#18214f", top: "#3f9a8a", hi: "#5fc4b2", dirt: "#2e3358", dirt2: "#232745", sun: "#e8eeff", cloud: "rgba(120,140,220,.25)", stars: 1},
  {s1: "#7ccaf0", s2: "#eefaff", h1: "#cfe9f7", h2: "#a8d4ea", top: "#e8fbff", hi: "#ffffff", dirt: "#6f93b3", dirt2: "#587a99", sun: "#ffffff", cloud: "rgba(255,255,255,.9)"},
  {s1: "#2a0a0a", s2: "#ff6a3d", h1: "#6a2020", h2: "#421212", top: "#e0602a", hi: "#ff9a4a", dirt: "#4a2424", dirt2: "#361818", sun: "#ffd27a", cloud: "rgba(80,30,30,.5)"},
  {s1: "#12051f", s2: "#6a1f6e", h1: "#4a1a58", h2: "#2e0f3a", top: "#b04ad0", hi: "#d77af0", dirt: "#33173f", dirt2: "#25102f", sun: "#ffd0ff", cloud: "rgba(200,120,220,.25)", stars: 1},
  {s1: "#26323d", s2: "#8a9aa5", h1: "#5d6e78", h2: "#44525c", top: "#7a9a6a", hi: "#98ba86", dirt: "#4a5359", dirt2: "#394146", sun: "#d8dde0", cloud: "rgba(60,70,80,.6)"},
  {s1: "#0a0a2a", s2: "#4a3a7a", h1: "#6a5a3a", h2: "#3f351f", top: "#f2c230", hi: "#ffe27a", dirt: "#3a3050", dirt2: "#2a2240", sun: "#fff2a0", cloud: "rgba(255,230,140,.25)", stars: 1}
];

/* ---------- Estado del nivel ---------- */
let solids = [], coins = [], enemies = [], spikes = [], checkpoints = [], rocks = [];
let boss = null;
let WORLD = 11500, GOALX = 11280, goalY = GY, theme = THEMES[0];
let lvl = 1, scoreStart = 0;
let p, cam = 0, lives = 3, score = 0, state = "title", cp, elapsed = 0, finalT = 0, hurtT = 0, shake = 0, t0 = 0, stateT = 0, introT = 0, mt = 0;

function loadSaved() { try { const v = parseInt(localStorage.getItem("pipo_lvl_v2"), 10); if (v >= 1 && v <= TOTAL) return v; } catch (e) {} return 1; }
function loadBest() { try { const v = parseInt(localStorage.getItem("pipo_best_v2"), 10); if (v >= 1 && v <= TOTAL) return v; } catch (e) {} return 1; }
function saveBest(v) { try { if (v > loadBest()) localStorage.setItem("pipo_best_v2", String(v)); } catch (e) {} }
function save(v) { try { localStorage.setItem("pipo_lvl_v2", String(v)); } catch (e) {} }

/* ---------- Generacion de niveles ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ground(a, b, y) { solids.push({x: a, y, w: b - a, h: H - y, type: "ground"}); }
function addCoin(x, y) { coins.push({x, y, got: false}); }
function patrol(a, b, gy, sp, kind) {
  const e = {x: (a + b) / 2, y: gy - 28, by: gy - 28, w: 34, h: 28, dir: Math.random() < .5 ? -1 : 1, sp, min: a, max: b, dead: 0, kind: kind || "walk", t: 0, ph: 0};
  if (kind === "bat") { e.h = 24; e.y = e.by = gy; }
  enemies.push(e); return e;
}
/* alcance horizontal maximo (aprox) de un salto cuando el destino esta 'rise' px mas alto */
function reach(rise, f) {
  const disc = JUMP * JUMP - 2 * GRAV * rise;
  return disc < 0 ? 0 : SPEED * ((JUMP + Math.sqrt(disc)) / GRAV) * f;
}

function buildLevel1() {
  const segs = [[0,1500],[1650,2800],[2950,4100],[4250,5300],[5450,6600],[6750,7900],[8050,9200],[9350,11500]];
  WORLD = 11500; GOALX = 11280; goalY = GY;
  checkpoints.push({x: 60, gy: GY}, {x: segs[3][0] + 120, gy: GY}, {x: segs[5][0] + 120, gy: GY});
  segs.forEach((s, i) => {
    const a = s[0], b = s[1];
    ground(a, b, GY);
    if (i === 0) {
      for (let k = 0; k < 5; k++) addCoin(a + 420 + k * 44, 320);
      solids.push({x: a + 700, y: 270, w: 180, h: 22, type: "plat"});
      for (let k = 0; k < 4; k++) addCoin(a + 725 + k * 40, 236);
      patrol(a + 900, a + 1250, GY, 55);
      return;
    }
    for (let k = 0; k < 5; k++) addCoin(a + 300 + k * 44, 322);
    solids.push({x: a + 480, y: 262, w: 170, h: 22, type: "plat"});
    for (let k = 0; k < 4; k++) addCoin(a + 505 + k * 40, 228);
    if (i % 2 === 1) {
      solids.push({x: a + 860, y: 330, w: 40, h: 40, type: "crate"});
      solids.push({x: a + 900, y: 330, w: 40, h: 40, type: "crate"});
      solids.push({x: a + 900, y: 290, w: 40, h: 40, type: "crate"});
      addCoin(a + 920, 250);
    } else {
      solids.push({x: a + 830, y: 240, w: 120, h: 22, type: "plat"});
      for (let k = 0; k < 3; k++) addCoin(a + 855 + k * 40, 206);
    }
    patrol(a + 560, a + 820, GY, 60 + i * 4);
    patrol(a + 980, Math.min(a + 1300, b - 120), GY, 65 + i * 4);
  });
}

function genLevel(n) {
  const d = (n - 2) / 8, R = rng(n * 7919 + 13), LEN = 7600 + n * 520;
  const f = 0.6 + 0.25 * d;
  const Lg = Math.round(260 - 120 * d);
  const rnd = (a, b) => a + R() * (b - a);
  const ri = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = arr => arr[Math.floor(R() * arr.length)];
  let x = 0, y = GY, cps = 0;
  ground(0, 640, GY); x = 640; checkpoints.push({x: 60, gy: GY});

  function run() {
    const len = ri(320, 620); ground(x, x + len, y);
    if (cps < 2 && x >= LEN * (cps + 1) / 3) { checkpoints.push({x: x + 50, gy: y}); cps++; }
    const a = x + 70, b = x + len - 90;
    if (b - a >= 170 && R() < 0.55 + 0.4 * d) {
      const avail = ["walk"]; if (n >= 4) avail.push("hop"); if (n >= 5) avail.push("spiky"); if (n >= 7) avail.push("charger");
      const newest = avail[avail.length - 1];
      const pk = () => (n >= 4 && R() < 0.4) ? newest : pick(avail);
      const mk = (aa, bb, kind) => { const e = patrol(aa, bb, y, kind === "charger" ? 50 : 60 + 55 * d, kind); e.ph = rnd(0, 6); };
      if (n >= 4 && b - a >= 420 && R() < 0.55) {
        const m = (a + b) / 2, k1 = pk(); let k2 = pk(); if (k2 === k1 && avail.length > 1) k2 = pick(avail.filter(k => k !== k1));
        mk(a, m - 20, k1); mk(m + 20, b, k2);
      } else mk(a, b, pk());
    }
    for (let k = 0; k < 4; k++) addCoin(x + 90 + k * 44, y - 50);
    x += len;
  }
  function gap() {
    const rise = pick([-60, -30, 0, 0, 30, 50]);
    const ny = Math.max(240, Math.min(GY, y - rise)), r = y - ny;
    const g = Math.max(90, Math.floor(reach(r, f) * rnd(0.8, 1)));
    ground(x + g, x + g + Lg, ny);
    addCoin(x + g / 2, Math.min(y, ny) - 90); addCoin(x + g / 2 - 36, Math.min(y, ny) - 70); addCoin(x + g / 2 + 36, Math.min(y, ny) - 70);
    x += g + Lg; y = ny;
  }
  function stones(type) {
    const k = ri(2, 3 + Math.round(2 * d)); let cx = x, cy = y, firstX = x;
    for (let i = 0; i < k; i++) {
      const rise = pick([-40, -20, 0, 20, 40, 60]);
      const ny = Math.max(210, Math.min(360, cy - rise)), r = cy - ny;
      const g = Math.max(70, Math.floor(reach(r, type === "crumble" ? f * 0.9 : f) * rnd(0.7, 1)));
      const w = Math.round((type === "crumble" ? 112 - 22 * d : 132 - 58 * d) * rnd(0.92, 1.15));
      const px = cx + g;
      const s = {x: px, y: ny, w, h: 22, type: "plat"};
      if (type === "crumble") s.cr = {t: -1, r: 0};
      solids.push(s);
      addCoin(px + w / 2, ny - 38);
      cx = px + w; cy = ny;
    }
    const ny = Math.max(250, Math.min(GY, cy + pick([0, 20, 40]))), r = cy - ny;
    const g = Math.max(70, Math.floor(reach(r, f) * rnd(0.75, 1)));
    ground(cx + g, cx + g + Lg, ny);
    if (n >= 6 && R() < 0.5) {
      const e = patrol(firstX + 120, cx - 20, 250, 70 + 20 * d, "bat"); e.ph = rnd(0, 6);
    }
    x = cx + g + Lg; y = ny;
  }
  function mover() {
    const ow = 112, eg = Math.max(70, Math.floor(reach(0, f) * 0.72));
    const range = Math.round(rnd(150, 230) + 50 * d), ay = d > 0.5 ? ri(0, 40) : 0;
    const pit = 2 * eg + ow + range;
    solids.push({x: x + eg, y, w: ow, h: 22, type: "plat", mv: {ox: x + eg, oy: y, ax: range, ay, sp: rnd(1.1, 1.4) + 0.5 * d, ph: rnd(0, 6)}});
    ground(x + pit, x + pit + Lg, y);
    for (let k = 0; k < 3; k++) addCoin(x + pit / 2 - 40 + k * 40, y - 100);
    x += pit + Lg;
  }
  function spikeRun() {
    const len = ri(440, 640); ground(x, x + len, y);
    let sx = x + 120;
    while (sx < x + len - 190) {
      const k = ri(1, d > 0.5 ? 3 : 2);
      for (let i = 0; i < k; i++) spikes.push({x: sx + i * 28, y: y - 18, w: 28, h: 18});
      addCoin(sx + k * 14, y - 95);
      sx += k * 28 + ri(150, 230);
    }
    x += len;
  }
  function tower() {
    const s = ri(2, 3), cw = 44, tx = x + 130, total = 130 + 2 * s * cw + 130;
    ground(x, x + total, y);
    for (let j = 0; j < 2 * s; j++) {
      const h = (j < s ? j + 1 : 2 * s - j) * 40;
      solids.push({x: tx + j * cw, y: y - h, w: cw, h, type: "crate"});
    }
    addCoin(tx + s * cw, y - s * 40 - 30);
    x += total;
  }

  const kinds = [["run", 3 - 2 * d], ["gap", 2 + d], ["stones", 2 + 3 * d], ["spike", d >= 0.1 ? 1 + d : 0], ["tower", 1.2],
                 ["mover", d >= 0.25 ? 1 + 2 * d : 0], ["crumble", d >= 0.5 ? 1 + 2.5 * d : 0]];
  let last = "";
  while (x < LEN) {
    let kind = "run";
    if (!(cps < 2 && x >= LEN * (cps + 1) / 3)) {
      const pool = kinds.filter(k => k[1] > 0 && k[0] !== last);
      let tot = pool.reduce((a, k) => a + k[1], 0), r = R() * tot;
      for (const k of pool) { r -= k[1]; if (r <= 0) { kind = k[0]; break; } }
    }
    ({run, gap, stones: () => stones("plat"), spike: spikeRun, tower, mover, crumble: () => stones("crumble")})[kind]();
    last = kind;
  }
  ground(x, x + 1100, y);
  GOALX = x + 420; WORLD = x + 1100; goalY = y;
}

/* jefe final: aparece solo en el ultimo nivel, bloqueando la meta hasta que se le gane */
function placeBoss() {
  const bw = 72, bh = 92, gy = goalY;
  const minX = GOALX - 420, maxX = GOALX - 170;
  boss = {x: maxX, y: gy - bh, w: bw, h: bh, hp: 3, maxHp: 3, dir: -1, minX, maxX, t: 0, cdAtk: 1.8, dead: 0, inv: 0};
  solids.push({x: GOALX - 90, y: gy - 420, w: 22, h: 420, type: "gate"});
}
function loadLevel(n) {
  lvl = n; theme = THEMES[n - 1];
  solids = []; coins = []; enemies = []; spikes = []; checkpoints = []; rocks = []; boss = null;
  if (n === 1) buildLevel1(); else genLevel(n);
  if (n === TOTAL) placeBoss();
  p = {x: 60, y: GY - 44, w: 28, h: 44, vx: 0, vy: 0, ground: false, face: 1, anim: 0, on: null, sprinting: false};
  cam = 0; lives = 3; score = scoreStart; cp = checkpoints[0]; elapsed = 0; finalT = 0; hurtT = 0; shake = 0; mt = 0; introT = 2.2;
  enemies.forEach(e => { e.dead = 0; e.x = (e.min + e.max) / 2; });
  dirs.l = dirs.r = false; sprint.l = sprint.r = false;
}

/* ---------- Entrada ---------- */
const dirs = {l: false, r: false}, sprint = {l: false, r: false}, lastTap = {l: -1e9, r: -1e9};
let jumpHeld = false, jumpBuf = 0, coyote = 0;
function press(d) {
  const now = performance.now();
  if (now - lastTap[d] < 350) sprint[d] = true;   /* doble toque = correr rapido */
  lastTap[d] = now; dirs[d] = true;
}
function release(d) { dirs[d] = false; sprint[d] = false; }
function startGame(n, keepScore) {
  initAudio(); if (!keepScore) scoreStart = 0;
  lvl = n; loadLevel(n); state = "play"; musicPlay(n);
}
function newGame() { save(1); startGame(1); }
function toMenu() { lvl = loadSaved(); scoreStart = 0; loadLevel(lvl); state = "title"; stateT = 0.3; }
function has3D() { try { return localStorage.getItem("pipo_3d_unlocked") === "1"; } catch (e) { return false; } }
function menuButtons() {
  if (state === "title") {
    const sv = loadSaved(), best = loadBest();
    let bt;
    if (sv > 1) {

    ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(x + 12 + e.dir, e.y + 10, 1.6, 0, 7); ctx.arc(x + 23 + e.dir, e.y + 10, 1.6, 0, 7); ctx.fill();
    return;
  }
  if (e.kind === "spiky") {
    ctx.fillStyle = "#f2f2f2";
    for (let k = 0; k < 4; k++) { const sx = x + 3 + k * 8; ctx.beginPath(); ctx.moveTo(sx, e.y + 2 + bob); ctx.lineTo(sx + 4, e.y - 12 + bob); ctx.lineTo(sx + 8, e.y + 2 + bob); ctx.fill(); }
  }
  if (e.kind === "charger") {
    ctx.fillStyle = "#fff2c0"; ctx.beginPath(); ctx.moveTo(x + e.w / 2 - 4, e.y - 2 + bob); ctx.lineTo(x + e.w / 2, e.y - 14 + bob); ctx.lineTo(x + e.w / 2 + 4, e.y - 2 + bob); ctx.fill();
  }
  ctx.fillStyle = e.kind === "hop" ? "#3fb56a" : e.kind === "spiky" ? "#d6453d" : e.kind === "charger" ? (e.cs ? "#ff5a1f" : "#f0a030") : "#9b59d0";
  ctx.beginPath(); ctx.moveTo(x, e.y + e.h); ctx.quadraticCurveTo(x, e.y - 6 + bob, x + e.w / 2, e.y - 4 + bob); ctx.quadraticCurveTo(x + e.w, e.y - 6 + bob, x + e.w, e.y + e.h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x + 11, e.y + 10, 5, 0, 7); ctx.arc(x + 24, e.y + 10, 5, 0, 7); ctx.fill();
  ctx.fillStyle = "#222"; const d = e.dir * 1.5;
  ctx.beginPath(); ctx.arc(x + 11 + d, e.y + 11, 2.3, 0, 7); ctx.arc(x + 24 + d, e.y + 11, 2.3, 0, 7); ctx.fill();
  ctx.strokeStyle = "#222"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 6, e.y + 4); ctx.lineTo(x + 14, e.y + 7); ctx.moveTo(x + 29, e.y + 4); ctx.lineTo(x + 21, e.y + 7); ctx.stroke();
}

function drawBoss(time) {
  if (!boss) return;
  const x = boss.x - cam; if (x < -120 || x > W + 120) return;
  if (boss.dead) {
    if (boss.dead > 0.5) return;
    ctx.fillStyle = "#4a2a5a"; rr(x, boss.y + boss.h - 10, boss.w, 10, 5); ctx.fill(); return;
  }
  const bob = Math.sin(time * 3.5) * 4;
  const flash = boss.inv > 0 && Math.floor(time * 16) % 2;
  ctx.fillStyle = flash ? "#ffffff" : "#4a2a5a"; rr(x, boss.y + bob, boss.w, boss.h, 16); ctx.fill();
  ctx.fillStyle = flash ? "#ffd0e6" : "#7a4aa8"; rr(x + 8, boss.y + bob + 12, boss.w - 16, boss.h - 32, 10); ctx.fill();
  ctx.fillStyle = "#ffe14d";
  ctx.beginPath(); ctx.arc(x + boss.w * 0.32, boss.y + bob + 32, 8, 0, 7); ctx.arc(x + boss.w * 0.68, boss.y + bob + 32, 8, 0, 7); ctx.fill();
  ctx.fillStyle = "#1c1030"; const d = boss.dir * 2;
  ctx.beginPath(); ctx.arc(x + boss.w * 0.32 + d, boss.y + bob + 32, 3.4, 0, 7); ctx.arc(x + boss.w * 0.68 + d, boss.y + bob + 32, 3.4, 0, 7); ctx.fill();
  ctx.fillStyle = "#1c1030"; rr(x + 10, boss.y + bob + boss.h - 18, boss.w - 20, 10, 4); ctx.fill();
  for (let i = 0; i < boss.maxHp; i++) {
    ctx.fillStyle = i < boss.hp ? "#ff6b81" : "rgba(255,255,255,.25)";
    ctx.beginPath(); ctx.arc(x + boss.w / 2 - (boss.maxHp - 1) * 9 + i * 18, boss.y + bob - 16, 6, 0, 7); ctx.fill();
  }
}
function drawRocks(time) {
  for (const r of rocks) {
    const x = r.x - cam; if (x < -30 || x > W + 30) continue;
    ctx.save(); ctx.translate(x, r.y); ctx.rotate(r.x * 0.01 + time);
    ctx.fillStyle = "#6a5244";
    ctx.beginPath(); ctx.moveTo(-10, -6); ctx.lineTo(8, -10); ctx.lineTo(11, 4); ctx.lineTo(-4, 10); ctx.lineTo(-12, 2); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawPlayer(time, dx = 0, alpha = 1) {
  if (alpha === 1 && hurtT > 0 && Math.floor(time * 14) % 2) return;
  const x = p.x - cam + dx, y = p.y;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x + p.w / 2, y + p.h / 2); ctx.scale(p.face, 1);
  const run = p.ground && Math.abs(p.vx) > 20, sw = run ? Math.sin(p.anim) * 7 : 0, air = !p.ground;
  ctx.fillStyle = "#ffcc33";
  rr(-12 + sw, 14, 11, 8, 3); ctx.fill(); rr(1 - sw, 14, 11, 8, 3); ctx.fill();
  ctx.fillStyle = "#2a9d8f"; rr(-13, -4, 26, 20, 6); ctx.fill();
  ctx.fillStyle = "#e9f9f6"; rr(-6, 2, 12, 8, 3); ctx.fill();
  ctx.fillStyle = "#2a9d8f"; rr(-14, -22, 28, 20, 8); ctx.fill();
  ctx.fillStyle = "#0e2a3a"; rr(-4, -17, 17, 11, 5); ctx.fill();
  ctx.fillStyle = "#7ff3ff"; ctx.beginPath(); ctx.arc(1, -11, 2.4, 0, 7); ctx.arc(8, -11, 2.4, 0, 7); ctx.fill();
  ctx.strokeStyle = "#1c6f66"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-4, -22); ctx.lineTo(-6, -29 - (air ? 3 : 0)); ctx.stroke();
  ctx.fillStyle = "#ff4d6d"; ctx.beginPath(); ctx.arc(-6, -30 - (air ? 3 : 0), 3, 0, 7); ctx.fill();
  ctx.fillStyle = "#ff4d6d"; ctx.beginPath(); ctx.moveTo(-12, -2); ctx.lineTo(-24 - Math.abs(p.vx) / 40, 2 + sw * 0.3); ctx.lineTo(-12, 5); ctx.fill();
  ctx.fillStyle = "#238a7e"; rr(10, 0 + (air ? -6 : 0), 6, 10, 3); ctx.fill();
  ctx.restore();
}

function drawGoal(time) {
  const x = GOALX + 60 - cam; if (x < -100 || x > W + 100) return;
  ctx.fillStyle = "#5b6585"; ctx.beginPath(); ctx.moveTo(x - 30, goalY); ctx.lineTo(x - 16, goalY - 170); ctx.lineTo(x + 16, goalY - 170); ctx.lineTo(x + 30, goalY); ctx.fill();
  ctx.fillStyle = "#8a96b8"; ctx.fillRect(x - 12, goalY - 120, 24, 8); ctx.fillRect(x - 14, goalY - 70, 28, 8);
  const g = ctx.createRadialGradient(x, goalY - 185, 4, x, goalY - 185, 60 + 8 * Math.sin(time * 5));
  g.addColorStop(0, "rgba(255,255,200,1)"); g.addColorStop(1, "rgba(255,230,100,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, goalY - 185, 70, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff6b0"; ctx.beginPath(); ctx.arc(x, goalY - 185, 14, 0, 7); ctx.fill();
}

function hud() {
  ctx.font = "bold 18px Arial"; ctx.textBaseline = "top";

function banner(t1, t2) {
  ctx.fillStyle = "rgba(8,14,34,.78)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.fillStyle = "#7ff3ff"; ctx.font = "bold 44px Arial"; ctx.fillText(t1, W / 2, 78);
  ctx.fillStyle = "#fff"; ctx.font = "20px Arial"; ctx.fillText(t2, W / 2, 118);
  const bt = menuButtons(); uiButtons = [];

    ctx.fillStyle = "#0b0f1f"; ctx.font = "bold 21px Arial"; ctx.fillText(b.t, W / 2, y + 31);
    uiButtons.push({x, y, w: bw, h: bh, fn: b.fn});

  ["Moverte: flechas o A/D  ·  Saltar: Espacio o ↑", "⚡ Doble toque en ◀ ▶ (y mantén) = correr rápido", "Salta sobre los monstruos (menos el de pinchos)", "Teclado: Espacio = primera opción  ·  N = juego nuevo"]
    .forEach((t, i) => ctx.fillText(t, W / 2, 372 + i * 20));
  ctx.textAlign = "left";
}

function draw(time) {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);
  drawBackground(time); drawSolids(); drawSpikes(); drawGoal(time); drawCoins(time);
  enemies.forEach(e => drawEnemy(e, time)); drawBoss(time); drawRocks(time);
  if (p.sprinting && state === "play") { drawPlayer(time, -16 * p.face, 0.28); drawPlayer(time, -32 * p.face, 0.14); }
  drawPlayer(time);
  ctx.restore();
  hud();
  ctx.textBaseline = "alphabetic";
  if (state === "play" && introT > 0) {
    ctx.globalAlpha = Math.min(1, introT); ctx.textAlign = "center";
    ctx.fillStyle = "#fff"; ctx.font = "bold 40px Arial"; ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 5;
    const t = "Nivel " + lvl + " · " + NAMES[lvl - 1];
    ctx.strokeText(t, W / 2, 160); ctx.fillText(t, W / 2, 160);
    const nm = NEWMON[lvl];
    if (nm) { ctx.font = "bold 22px Arial"; ctx.lineWidth = 4; ctx.fillStyle = "#ffe14d"; ctx.strokeText(nm, W / 2, 200); ctx.fillText(nm, W / 2, 200); }
    ctx.globalAlpha = 1; ctx.textAlign = "left";
  }
  uiButtons = state === "play" ? [] : uiButtons;
  if (state === "title") banner("PIPO Y LA TORRE LUZ", "10 niveles de parkour · cada uno más difícil");
  if (state === "over") banner("FIN DEL JUEGO", "Nivel " + lvl + " · Monedas: " + score);
  if (state === "win") {
    if (lvl >= TOTAL) banner("¡GANASTE EL JUEGO!", "Completaste los 10 niveles · Puntos: " + score);
    else banner("¡NIVEL " + lvl + " COMPLETADO!", "Tiempo: " + finalT.toFixed(1) + " s   ·   Puntos: " + score);
  }
}

/* ---------- Fábricas reutilizables ---------- */
const matPlatformTop = new THREE.MeshStandardMaterial({ color: 0x58c04c, roughness: 0.8 });
const matPlatformSide = new THREE.MeshStandardMaterial({ color: 0x8a5a35, roughness: 0.9 });
const matPlatformGlow = new THREE.MeshBasicMaterial({ color: 0x7ff3ff });
const matPlatformWarn = new THREE.MeshBasicMaterial({ color: 0xffb020 });

function makePlatform(x, y, z, w, d, h, opts) {
  opts = opts || {};
  const g = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [matPlatformSide, matPlatformSide, matPlatformTop, matPlatformSide, matPlatformSide, matPlatformSide]);
  g.add(box);
  const rim = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, 0.08, d + 0.1), opts.fall ? matPlatformWarn : matPlatformGlow);
  rim.position.set(0, h / 2 + 0.02, 0);
  g.add(rim);
  g.position.set(x, y, z);
  tdScene.add(g);
  const data = {
    x, y, z, w, d, h, mesh: g, solid: true,
    baseX: x, baseY: y, baseZ: z, phase: Math.random() * 10,
    moving: opts.moving || null,      // { axis:'x'|'y'|'z', range, speed }
    vanish: opts.vanish || null,      // { onT, offT }
    vanishT: 0, vanishOn: true,
    fall: !!opts.fall, fallDelay: opts.fallDelay || 0.55, fallT: -1, falling: false,
    rotate: opts.rotate || null       // rotación puramente visual
  };
  tdPlatforms.push(data);
  return data;
}

function makeCoin(x, y, z, secret) {
  const g = new THREE.Group();
  const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.28, 0), new THREE.MeshStandardMaterial({ color: secret ? 0xff9fd6 : 0xffe14d, emissive: secret ? 0x993366 : 0x8a6a00, emissiveIntensity: 0.4, metalness: 0.4, roughness: 0.25 }));
  g.add(gem);
  g.position.set(x, y, z);
  tdScene.add(g);
  const data = { mesh: g, x, y, z, taken: false, phase: Math.random() * 10 };
  tdCoins.push(data);
  tdCoinTotalCount++;
  return data;
}

let tdCoinTotalCount = 0;

function makeCheckpoint(x, y, z, index) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.6, 8), new THREE.MeshStandardMaterial({ color: 0x888888 }));
  pole.position.y = 0.8; g.add(pole);
  const flag = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.5, 6), new THREE.MeshStandardMaterial({ color: 0x555555, emissive: 0x000000 }));
  flag.position.set(0.22, 1.45, 0); flag.rotation.z = -Math.PI / 2; g.add(flag);
  g.position.set(x, y, z);
  tdScene.add(g);
  const data = { mesh: g, flag, x, y, z, index, active: false };
  tdCheckpoints.push(data);
  return data;
}

function makeHazard(type, x, y, z, opts) {
  opts = opts || {};
  const data = { type, x, y, z, baseX: x, baseY: y, baseZ: z, phase: Math.random() * 10, opts, mesh: null, on: true };
  if (type === "spike") {
    const g = new THREE.Group();
    for (let i = -1; i <= 1; i++) {
      const s = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.5, 6), new THREE.MeshStandardMaterial({ color: 0xcfd8e3 }));
      s.position.set(i * 0.3, 0.25, 0); g.add(s);
    }
    g.position.set(x, y, z); tdScene.add(g); data.mesh = g; data.r = 0.6;
  } else if (type === "fire") {
    const g = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.1, 10), new THREE.MeshBasicMaterial({ color: 0xff6a2a, transparent: true, opacity: 0.85 }));
    g.position.set(x, y + 0.5, z); tdScene.add(g); data.mesh = g; data.r = 0.55;
  } else if (type === "laser") {
    const g = new THREE.Mesh(new THREE.BoxGeometry(opts.len || 4, 0.12, 0.12), new THREE.MeshBasicMaterial({ color: 0xff2e5b }));
    g.position.set(x, y, z); tdScene.add(g); data.mesh = g; data.len = opts.len || 4;
    data.toggle = opts.toggle || 1.4;
  } else if (type === "crusher") {
    const g = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshStandardMaterial({ color: 0x55596e, roughness: 0.6 }));
    g.position.set(x, y + 3, z); tdScene.add(g); data.mesh = g; data.restY = y + 3; data.slamY = y + 0.7; data.r = 0.9; data.cyc = opts.cyc || 2.4;
  } else if (type === "wall") {
    const g = new THREE.Mesh(new THREE.BoxGeometry(opts.w || 3.2, 1.8, 0.4), new THREE.MeshStandardMaterial({ color: 0x6a4a3a, roughness: 0.8 }));
    g.position.set(x, y + 0.9, z); tdScene.add(g); data.mesh = g; data.range = opts.range || 2.6; data.speed = opts.speed || 1.6; data.axis = opts.axis || "x"; data.r = (opts.w || 3.2) / 2;
  } else if (type === "faller") {
    data.spawnEvery = opts.every || 2.2; data.timer = Math.random() * data.spawnEvery; data.active = []; data.r = 0.4;
  } else if (type === "spinner") {
    const g = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.4, 8), new THREE.MeshStandardMaterial({ color: 0x444444 }));
    g.add(pole);
    const bar = new THREE.Mesh(new THREE.BoxGeometry(opts.len || 3.4, 0.2, 0.2), new THREE.MeshStandardMaterial({ color: 0xff5050 }));
    bar.position.y = 0.7; g.add(bar);
    g.position.set(x, y, z); tdScene.add(g); data.mesh = g; data.bar = bar; data.len = opts.len || 3.4; data.spin = opts.spin || 1.6;
  }
  tdHazards.push(data);
  return data;
}

function makePowerup(type, x, y, z) {
  const colors = { speed: 0x4fd1ff, jump: 0x9bff5a, shield: 0xffd94f, magnet: 0xff7ad9, invincible: 0xffffff };
  const g = new THREE.Mesh(new THREE.IcosahedronGeometry(0.34, 0), new THREE.MeshStandardMaterial({ color: colors[type] || 0xffffff, emissive: colors[type] || 0xffffff, emissiveIntensity: 0.5 }));
  g.position.set(x, y, z); tdScene.add(g);
  const data = { type, mesh: g, x, y, z, taken: false, phase: Math.random() * 10 };
  tdPowerups.push(data);
  return data;
}

/* enemigos: se guardan en tdMonsters (mismo array de siempre) con un

function makeEnemy(kind, x, y, z, opts) {
  opts = opts || {};
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.75, 0), new THREE.MeshStandardMaterial({ color: kind === "shooter" ? 0xff6a3d : kind === "chase" ? 0xff2e5b : 0x8a3ffb, roughness: 0.5 }));
  g.add(body);
  [-0.3, 0.3].forEach(ex => { const eye = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffe66d })); eye.position.set(ex, 0.15, 0.6); g.add(eye); });
  g.position.set(x, y, z);
  tdScene.add(g);
  const data = {
    mesh: g, kind, baseX: x, baseY: y, baseZ: z, phase: Math.random() * 10, alive: true, hp: opts.hp || 1,
    range: opts.range || 3.5, speed: opts.speed || 2.2, shootT: Math.random() * 2, dir: 1
  };
  tdMonsters.push(data);
  return data;
}

/* ---------- 12. RECORRIDO: construcción progresiva del nivel ---------- */
function buildLevel3D() {
  tdCoinTotalCount = 0;
  let px = 0, py = 0, pz = 0;
  makePlatform(px, py, pz, 10, 10, 1.2);
  makeCheckpoint(px, py + 0.6, pz + 2, 0);
  tdCheckpoints[0].active = true; tdCheckpoints[0].flag.material.color.set(0x4caf50); tdCheckpoints[0].flag.material.emissive.set(0x1a4a1a);

  const spine = [
    /* ---- Sección A: lo básico + dash (estaciones 1-5) ---- */
    { d: [4, 0, -6], },
    { d: [4, 0, -6], coin: 1 },

function buildBoss(x, y, z) {

  tdBoss = {
    mesh: g, core, x, y, z, baseY: y,

  };

/* ---------- entrada/estado ---------- */
function reset3D() {
  const start = tdCheckpoints[0] || { x: 0, y: 1.8, z: 1.5 };
  tdPlayer.pos.set(start.x, start.y + 1.2, start.z);
  tdPlayer.vel.set(0, 0, 0); tdPlayer.grounded = true; tdPlayer.lastSafe.copy(tdPlayer.pos);
  tdPlayer.jumpsUsed = 0; tdPlayer.dashCd = 0; tdPlayer.dashT = 0; tdPlayer.hurtT = 0; tdPlayer.coins = 0;
  tdCamYaw = Math.PI;
  tdMonsters.forEach(m => { m.alive = true; m.mesh.visible = true; m.hp = m.hp || 1; });
  tdCoins.forEach(c => { c.taken = false; c.mesh.visible = true; });
  tdPowerups.forEach(p => { p.taken = false; p.mesh.visible = true; });
  tdActivePU = { speed: 0, jump: 0, shield: 0, magnet: 0, invincible: 0 };
  tdCheckpoints.forEach((c, i) => { c.active = i === 0; c.flag.material.color.set(i === 0 ? 0x4caf50 : 0x555555); });
  if (tdChase) { tdChase.active = false; tdChase.done = false; if (tdChase.mesh) tdChase.mesh.visible = false; }
  if (tdBoss) { tdBoss.hp = tdBoss.hpMax; tdBoss.phase = 1; tdBoss.state = "idle"; tdBoss.stateT = 1.2; tdBoss.vulnerable = false; tdBoss.alive = true; tdBoss.dead = false; tdBoss.mesh.visible = true; }
  if (tdGoal) tdGoal.mesh.visible = false;
  updateCoinHud(); updateBossHud();
}

function td3dActiveCheckpoint() {
  for (let i = tdCheckpoints.length - 1; i >= 0; i--) if (tdCheckpoints[i].active) return tdCheckpoints[i];
  return tdCheckpoints[0];
}

function tdRespawn(msg) {
  const cp = td3dActiveCheckpoint();
  tdPlayer.pos.set(cp.x, cp.y + 1, cp.z);
  tdPlayer.vel.set(0, 0, 0); tdPlayer.jumpsUsed = 0; tdPlayer.hurtT = td3D.hurtInvuln;
  if (tdChase) { tdChase.active = false; if (tdChase.mesh) tdChase.mesh.visible = false; }
  showMsg3D(msg || "¡Vuelves al último checkpoint!");
}

function tdPlayerHurt(msg) {
  if (tdPlayer.hurtT > 0) return;
  if (tdActivePU.invincible > 0) return;
  if (tdActivePU.shield > 0) { tdActivePU.shield = 0; showMsg3D("¡El escudo te protegió!"); tdPlayer.hurtT = 0.4; return; }
  tdRespawn(msg);
}

/* ---------- 1. DASH: hacia adelante, izquierda o derecha según el movimiento
   actual (relativo a la cámara); si no hay input, usa hacia donde mira Pipo. */
function tdDash() {
  if (state !== "mode3d") return;
  if (tdPlayer.dashCd > 0 || tdPlayer.dashT > 0) return;
  const fwd = new THREE.Vector3(Math.sin(tdCamYaw), 0, Math.cos(tdCamYaw));
  const right = new THREE.Vector3(Math.sin(tdCamYaw + Math.PI / 2), 0, Math.cos(tdCamYaw + Math.PI / 2));
  let mx = tdMoveX, mz = tdMoveZ;
  if (tdKeys["w"] || tdKeys["arrowup"]) mz = -1;
  if (tdKeys["s"] || tdKeys["arrowdown"]) mz = 1;
  if (tdKeys["a"] || tdKeys["arrowleft"]) mx = -1;
  if (tdKeys["d"] || tdKeys["arrowright"]) mx = 1;
  const dir = new THREE.Vector3();
  dir.addScaledVector(fwd, -mz); dir.addScaledVector(right, -mx);
  tdPlayer.dashDir.copy(dir.lengthSq() > 0.05 ? dir.normalize() : tdPlayer.facing);
  tdPlayer.dashT = td3D.dashTime;
  tdPlayer.dashCd = td3D.dashCooldown;
  tdPlayer.hurtT = Math.max(tdPlayer.hurtT, td3D.dashTime + 0.05); // breves i-frames durante el dash
  showMsg3D("¡DASH!");
}

/* ---------- Salto (incluye doble salto) ---------- */
function tdJump() {
  if (state !== "mode3d") return;
  const jumpMult = tdActivePU.jump > 0 ? 1.45 : 1;
  if (tdPlayer.grounded) { tdPlayer.vel.y = td3D.jumpVel * jumpMult; tdPlayer.grounded = false; tdPlayer.jumpsUsed = 1; }
  else if (tdPlayer.jumpsUsed < 2) { tdPlayer.vel.y = td3D.jumpVel2 * jumpMult; tdPlayer.jumpsUsed = 2; showMsg3D("¡Doble salto!"); }
}

function tdFireLaser() {
  if (state !== "mode3d") return;
  const dir = new THREE.Vector3(Math.sin(tdCamYaw), 0, Math.cos(tdCamYaw));
  const origin = tdPipo.position.clone(); origin.y += 1.0;
  let closest = null, closestD = 9, isBoss = false;
  tdMonsters.forEach(m => {
    if (!m.alive) return;
    const to = m.mesh.position.clone().sub(origin); const d = to.length(); to.normalize();
    const align = to.dot(dir.clone().normalize());
    if (d < 9 && align > 0.85 && d < closestD) { closest = m; closestD = d; isBoss = false; }
  });
  if (tdBoss && tdBoss.alive && tdBoss.vulnerable) {
    const to = tdBoss.mesh.position.clone().sub(origin); const d = to.length(); to.normalize();
    const align = to.dot(dir.clone().normalize());
    if (d < 14 && align > 0.85 && d < closestD) { closest = tdBoss; closestD = d; isBoss = true; }
  }
  const geo = new THREE.BufferGeometry().setFromPoints([origin, closest ? closest.mesh.position.clone() : origin.clone().add(dir.multiplyScalar(10))]);
  const beam = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xff4d6d }));
  tdScene.add(beam);
  tdLaserBeams.push({ mesh: beam, life: 0.15 });
  if (closest) {
    if (isBoss) { tdBossHit(); }
    else { closest.hp -= 1; if (closest.hp <= 0) { closest.alive = false; closest.mesh.visible = false; showMsg3D("¡Enemigo destruido!"); } }
  }
}

    fragmentShader: "varying vec3 vPos; uniform vec3 top; uniform vec3 bot; void main(){ float h=normalize(vPos).y*0.5+0.5; gl_FragColor=vec4(mix(bot,top,h),1.0); }"

    body.position.y = 0.95; tdPipo.add(body);

    function leg(sx) { const l = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.75, 0.3), new THREE.MeshStandardMaterial({ color: 0x1c2742 })); l.position.set(sx, 0.4, 0); tdPipo.add(l); return l; }
    const legL = leg(-0.26), legR = leg(0.26);
    function arm(sx) { const a = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.7, 0.26), new THREE.MeshStandardMaterial({ color: 0x28365a })); a.position.set(sx, 1.0, 0); tdPipo.add(a); return a; }
    const armL = arm(-0.58), armR = arm(0.58);

    const shieldFx = new THREE.Mesh(new THREE.SphereGeometry(0.95, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffd94f, transparent: true, opacity: 0.25, wireframe: true }));

    if (!el) return;

    const dt = Math.min(0.033, (now - tdLast) / 1000); tdLast = now;
    if (td3dRunning) update3D(dt);
    tdRenderer.render(tdScene, tdCamera);
    requestAnimationFrame(td3dFrame);
  }
  requestAnimationFrame(td3dFrame);
}

function setupStick3D() {
  const stick = document.getElementById("stick3d"), knob = document.getElementById("knob3d");
  let active = false, cx = 0, cy = 0;
  stick.addEventListener("pointerdown", e => { active = true; const r = stick.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; stick.setPointerCapture(e.pointerId); });
  stick.addEventListener("pointermove", e => {
    if (!active) return;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const d = Math.hypot(dx, dy), max = 50;
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    knob.style.left = (27 + (dx / max) * 20) + "%"; knob.style.top = (27 + (dy / max) * 20) + "%";
    tdMoveX = dx / max; tdMoveZ = dy / max;
  });
  function releaseStick() { active = false; tdMoveX = 0; tdMoveZ = 0; knob.style.left = "27%"; knob.style.top = "27%"; }
  stick.addEventListener("pointerup", releaseStick);
  stick.addEventListener("pointercancel", releaseStick);
}

/* ---------- 10. Jefe: golpe recibido ---------- */
function tdBossHit() {
  if (!tdBoss || !tdBoss.alive) return;
  tdBoss.hp -= 1;
  tdBoss.vulnerable = false;
  showMsg3D("¡Le diste al jefe! (" + Math.max(0, tdBoss.hp) + "/" + tdBoss.hpMax + ")");
  if (tdBoss.hp <= tdBoss.hpMax / 2 && tdBoss.phase === 1) { tdBoss.phase = 2; showMsg3D("¡El jefe se puso furioso!"); }
  if (tdBoss.hp <= 0) {
    tdBoss.alive = false; tdBoss.dead = true; tdBoss.mesh.visible = false;
    if (tdGoal) tdGoal.mesh.visible = true;
    showMsg3D("¡JEFE DERROTADO! Ve a la luz para terminar la torre.");
    try { localStorage.setItem("pipo_3d_boss_beaten", "1"); } catch (e) {}
  }
  updateBossHud();
}

/* ---------- Actualización del jefe (fases y ataques) ---------- */
function updateBoss(dt) {
  if (!tdBoss || !tdBoss.alive) return;
  const fast = tdBoss.phase === 2;
  tdBoss.stateT -= dt;
  const toPlayer = tdPlayer.pos.clone().sub(tdBoss.mesh.position); toPlayer.y = 0;
  const dist = toPlayer.length();

  if (tdBoss.state === "idle") {
    tdBoss.mesh.position.y = tdBoss.baseY + Math.sin(performance.now() * 0.002) * 0.3;
    tdBoss.mesh.rotation.y += dt * 0.4;
    if (tdBoss.stateT <= 0) { tdBoss.state = Math.random() < 0.5 ? "telegraph" : "volley"; tdBoss.stateT = fast ? 0.5 : 0.8; tdBoss.vulnerable = false; }
  } else if (tdBoss.state === "telegraph") {
    tdBoss.core.material.color.setHSL((performance.now() % 300) / 300, 1, 0.5);
    if (tdBoss.stateT <= 0) { tdBoss.state = "slam"; tdBoss.stateT = 0.35; }
  } else if (tdBoss.state === "slam") {
    tdBoss.mesh.position.y = tdBoss.baseY - 0.4;
    if (dist < 3.4) tdPlayerHurt("¡El golpe del jefe te alcanzó!");
    if (tdBoss.stateT <= 0) { tdBoss.state = "vulnerable"; tdBoss.stateT = fast ? 1.4 : 2.0; tdBoss.vulnerable = true; tdBoss.core.material.color.set(0x7fff7f); }
  } else if (tdBoss.state === "vulnerable") {
    tdBoss.mesh.position.y = tdBoss.baseY;
    if (tdBoss.stateT <= 0) { tdBoss.state = "idle"; tdBoss.stateT = fast ? 0.7 : 1.3; tdBoss.vulnerable = false; tdBoss.core.material.color.set(0xff2e5b); }
  } else if (tdBoss.state === "volley") {
    if (tdBoss.stateT <= 0) {
      for (let i = -1; i <= 1; i++) {
        const dir = toPlayer.clone().normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), i * 0.25);
        tdProjectiles.push({ pos: tdBoss.mesh.position.clone(), vel: dir.multiplyScalar(fast ? 9 : 6.5), life: 3 });
      }
      tdBoss.state = "idle"; tdBoss.stateT = fast ? 0.6 : 1.1;
    }
  }
}

let tdProjectiles = [];

function update3D(dt) {
  /* ---------- movimiento base (cámara libre, correr, salto) ---------- */
  const fwd = new THREE.Vector3(Math.sin(tdCamYaw), 0, Math.cos(tdCamYaw));
  const right = new THREE.Vector3(Math.sin(tdCamYaw + Math.PI / 2), 0, Math.cos(tdCamYaw + Math.PI / 2));
  let mx = tdMoveX, mz = tdMoveZ;
  if (tdKeys["w"] || tdKeys["arrowup"]) mz = -1;
  if (tdKeys["s"] || tdKeys["arrowdown"]) mz = 1;
  if (tdKeys["a"] || tdKeys["arrowleft"]) mx = -1;
  if (tdKeys["d"] || tdKeys["arrowright"]) mx = 1;
  const moveDir = new THREE.Vector3();
  moveDir.addScaledVector(fwd, -mz); moveDir.addScaledVector(right, -mx);
  if (moveDir.lengthSq() > 1) moveDir.normalize();
  if (moveDir.lengthSq() > 0.02) tdPlayer.facing.copy(moveDir);

  /* 1. DASH: mientras dura, ignora el movimiento normal y empuja fuerte
     en la dirección calculada por tdDash() */
  if (tdPlayer.dashCd > 0) tdPlayer.dashCd -= dt;
  if (tdPlayer.dashT > 0) {
    tdPlayer.dashT -= dt;
    tdPlayer.pos.x += tdPlayer.dashDir.x * td3D.dashSpeed * dt;
    tdPlayer.pos.z += tdPlayer.dashDir.z * td3D.dashSpeed * dt;
  }

  const sprinting = !!(tdKeys["shift"] && moveDir.lengthSq() > 0.02);
  let speed = td3D.moveSpeed * (sprinting ? td3D.sprintMult : 1) * (tdActivePU.speed > 0 ? 1.5 : 1);
  if (tdPlayer.dashT <= 0) {
    tdPlayer.pos.x += moveDir.x * speed * dt; tdPlayer.pos.z += moveDir.z * speed * dt;
  }
  if (moveDir.lengthSq() > 0.02) {
    const targetAngle = Math.atan2(moveDir.x, moveDir.z);
    let diff = targetAngle - tdPipo.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    tdPipo.rotation.y += diff * Math.min(1, dt * 10);
    const s = tdPipo.userData, swing = Math.sin(performance.now() * (sprinting ? 0.02 : 0.012)) * 0.6;
    s.legL.rotation.x = swing; s.legR.rotation.x = -swing; s.armL.rotation.x = -swing; s.armR.rotation.x = swing;
  }

  tdPlayer.vel.y += td3D.gravity * dt; tdPlayer.pos.y += tdPlayer.vel.y * dt;

  /* ---------- 2./6./11. plataformas y su física (móviles, que desaparecen, que caen) ---------- */
  tdPlatforms.forEach(pl => {
    if (pl.moving) {
      pl.phase += dt * pl.moving.speed;
      const off = Math.sin(pl.phase) * pl.moving.range;
      if (pl.moving.axis === "x") pl.x = pl.baseX + off;
      else if (pl.moving.axis === "y") pl.y = pl.baseY + off;
      else pl.z = pl.baseZ + off;
      pl.mesh.position.set(pl.x, pl.y, pl.z);
    }
    if (pl.vanish) {
      pl.vanishT += dt;
      const cyc = pl.vanish.onT + pl.vanish.offT;
      pl.vanishOn = (pl.vanishT % cyc) < pl.vanish.onT;
      pl.mesh.visible = pl.vanishOn;
      pl.solid = pl.vanishOn;
    }
    if (pl.rotate) { pl.mesh.rotation.y += dt * pl.rotate.speed; }
    if (pl.falling) {
      pl.y -= 9.5 * dt; pl.mesh.position.y = pl.y;
      if (pl.y < pl.baseY - 14) pl.solid = false;
    }
  });

  let support = null;
  tdPlatforms.forEach(pl => {
    if (!pl.solid) return;
    const withinX = Math.abs(tdPlayer.pos.x - pl.x) < pl.w / 2 + 0.35;
    const withinZ = Math.abs(tdPlayer.pos.z - pl.z) < pl.d / 2 + 0.35;
    const top = pl.y + pl.h / 2;
    if (withinX && withinZ && tdPlayer.pos.y - top < 0.6 && tdPlayer.pos.y - top > -1.2) { if (!support || top > support.top) support = { top, pl }; }
  });
  if (support && tdPlayer.vel.y <= 0 && tdPlayer.pos.y <= support.top + 0.05) {
    tdPlayer.pos.y = support.top; tdPlayer.vel.y = 0; tdPlayer.grounded = true; tdPlayer.jumpsUsed = 0; tdPlayer.lastSafe.copy(tdPlayer.pos);
    if (support.pl.fall && support.pl.fallT < 0) support.pl.fallT = support.pl.fallDelay;
  } else { tdPlayer.grounded = false; }

  tdPlatforms.forEach(pl => {
    if (pl.fall && pl.fallT >= 0 && !pl.falling) {
      pl.fallT -= dt;
      pl.mesh.children[1].material.color.setHSL(0.11, 1, 0.5 + Math.sin(performance.now() * 0.02) * 0.2);
      if (pl.fallT <= 0) pl.falling = true;
    }
  });

  if (tdPlayer.pos.y < -24) { tdRespawn("¡Casi te caes! Vuelves al checkpoint."); }

  /* ---------- 3. monedas / cristales ---------- */
  const magnetR = tdActivePU.magnet > 0 ? td3D.coinMagnetRadiusPU : td3D.coinMagnetRadius;
  tdCoins.forEach(c => {
    if (c.taken) return;
    c.phase += dt;
    c.mesh.position.set(c.x, c.y + Math.sin(c.phase * 2) * 0.12, c.z);
    c.mesh.rotation.y += dt * 2;
    const d = tdPlayer.pos.distanceTo(c.mesh.position);
    if (tdActivePU.magnet > 0 && d < magnetR) { c.mesh.position.lerp(tdPlayer.pos, Math.min(1, dt * 5)); }
    if (d < 0.9) { c.taken = true; c.mesh.visible = false; tdPlayer.coins++; updateCoinHud(); showMsg3D("+1 cristal"); }
  });

  /* ---------- 4. checkpoints ---------- */
  tdCheckpoints.forEach(c => {
    if (c.active) return;
    if (tdPlayer.pos.distanceTo(c.mesh.position) < 1.8) {
      tdCheckpoints.forEach(o => { o.active = false; o.flag.material.color.set(0x555555); });
      c.active = true; c.flag.material.color.set(0x4caf50); c.flag.material.emissive.set(0x1a4a1a);
      showMsg3D("¡Checkpoint guardado!");
    }
  });

  /* ---------- 9. power-ups ---------- */
  Object.keys(tdActivePU).forEach(k => { if (tdActivePU[k] > 0) tdActivePU[k] = Math.max(0, tdActivePU[k] - dt); });
  tdPowerups.forEach(p => {
    if (p.taken) return;
    p.phase += dt; p.mesh.position.set(p.x, p.y + Math.sin(p.phase * 2) * 0.15, p.z); p.mesh.rotation.y += dt * 2.5;
    if (tdPlayer.pos.distanceTo(p.mesh.position) < 1) {
      p.taken = true; p.mesh.visible = false; tdActivePU[p.type] = td3D.puDuration;
      showMsg3D("¡Power-up: " + p.type.toUpperCase() + "!");
    }
  });
  tdPipo.userData.shieldFx.visible = tdActivePU.shield > 0;
  if (tdPipo.userData.shieldFx.visible) tdPipo.userData.shieldFx.rotation.y += dt;
  updatePUHud();

  /* ---------- 6./11. trampas / obstáculos dinámicos ---------- */
  tdHazards.forEach(hz => {
    hz.phase += dt;
    if (hz.type === "laser") {
      hz.on = (hz.phase % (hz.toggle * 2)) < hz.toggle;
      hz.mesh.visible = hz.on;
      hz.mesh.material.opacity = 1;
      if (hz.on && Math.abs(tdPlayer.pos.x - hz.x) < hz.len / 2 && Math.abs(tdPlayer.pos.z - hz.z) < 0.5 && Math.abs(tdPlayer.pos.y - hz.y) < 0.6) tdPlayerHurt("¡Te quemó el láser!");
    } else if (hz.type === "spinner") {
      hz.mesh.rotation.y += dt * hz.spin;
      const dx = tdPlayer.pos.x - hz.x, dz = tdPlayer.pos.z - hz.z;
      const d = Math.hypot(dx, dz);
      if (d < hz.len / 2 + 0.4 && Math.abs(tdPlayer.pos.y - (hz.y + 0.7)) < 0.6) {
        tdPlayer.vel.x = (dx / (d || 1)) * 4; tdPlayer.pos.x += (dx / (d || 1)) * 0.4; tdPlayer.pos.z += (dz / (d || 1)) * 0.4;
        tdPlayerHurt("¡El bloque giratorio te golpeó!");
      }
    } else if (hz.type === "crusher") {
      const t = (Math.sin(hz.phase / hz.cyc * Math.PI * 2 - Math.PI / 2) + 1) / 2;
      hz.mesh.position.y = hz.slamY + (hz.restY - hz.slamY) * (1 - Math.pow(t, 4));
      const close = hz.mesh.position.y < hz.slamY + 0.5;
      if (close && Math.abs(tdPlayer.pos.x - hz.x) < hz.r + 0.4 && Math.abs(tdPlayer.pos.z - hz.z) < hz.r + 0.4 && Math.abs(tdPlayer.pos.y - hz.mesh.position.y) < 1) tdPlayerHurt("¡El aplastador te alcanzó!");
    } else if (hz.type === "wall") {
      const off = Math.sin(hz.phase * hz.speed) * hz.range;
      if (hz.axis === "x") hz.mesh.position.x = hz.baseX + off; else hz.mesh.position.z = hz.baseZ + off;
      hz.x = hz.mesh.position.x; hz.z = hz.mesh.position.z;
      if (Math.abs(tdPlayer.pos.x - hz.x) < hz.r + 0.4 && Math.abs(tdPlayer.pos.z - hz.z) < 0.6 && Math.abs(tdPlayer.pos.y - hz.y) < 1) {
        tdPlayer.pos.x += (hz.axis === "x" ? Math.sign(tdPlayer.pos.x - hz.x || 1) : 0) * 2;
        tdPlayer.pos.z += (hz.axis === "z" ? Math.sign(tdPlayer.pos.z - hz.z || 1) : 0) * 2;
        tdPlayerHurt("¡La pared te empujó!");
      }
    } else if (hz.type === "faller") {
      hz.timer -= dt;
      if (hz.timer <= 0) {
        hz.timer = hz.spawnEvery;
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), new THREE.MeshStandardMaterial({ color: 0x8a5a35 }));
        m.position.set(hz.x + (Math.random() - 0.5) * 2, hz.y + 8, hz.z);
        tdScene.add(m);
        hz.active.push({ mesh: m, vy: 0 });
      }
      for (let i = hz.active.length - 1; i >= 0; i--) {
        const o = hz.active[i]; o.vy += td3D.gravity * dt; o.mesh.position.y += o.vy * dt;
        if (o.mesh.position.distanceTo(tdPlayer.pos) < 0.9) { tdPlayerHurt("¡Un objeto te cayó encima!"); }
        if (o.mesh.position.y < hz.y - 2) { tdScene.remove(o.mesh); hz.active.splice(i, 1); }
      }
    } else {
      // pinchos y fuego: zona fija de daño
      if (Math.abs(tdPlayer.pos.x - hz.x) < hz.r && Math.abs(tdPlayer.pos.z - hz.z) < hz.r && Math.abs(tdPlayer.pos.y - hz.y) < 0.8) {
        tdPlayerHurt(hz.type === "fire" ? "¡Te quemaste!" : "¡Pisaste los pinchos!");
      }
      if (hz.type === "fire") hz.mesh.scale.setScalar(0.9 + Math.sin(hz.phase * 8) * 0.1);
    }
  });

  /* ---------- 5. enemigos ---------- */
  tdMonsters.forEach(m => {
    if (!m.alive) return;
    m.phase += dt;
    if (m.kind === "patrol") {
      m.mesh.position.x = m.baseX + Math.sin(m.phase * m.speed * 0.5) * m.range;
      m.mesh.position.y = m.baseY + Math.sin(m.phase * 2) * 0.15;
      m.mesh.position.z = m.baseZ;
    } else if (m.kind === "chase") {
      const d = tdPlayer.pos.distanceTo(m.mesh.position);
      if (d < 7) {
        const dir = tdPlayer.pos.clone().sub(m.mesh.position); dir.y = 0; dir.normalize();
        m.mesh.position.addScaledVector(dir, m.speed * dt);
      }
      m.mesh.position.y = m.baseY + Math.sin(m.phase * 3) * 0.1;
    } else if (m.kind === "shooter") {
      m.mesh.position.y = m.baseY + Math.sin(m.phase * 1.5) * 0.2;
      m.shootT -= dt;
      if (m.shootT <= 0) {
        m.shootT = 2.1;
        const dir = tdPlayer.pos.clone().sub(m.mesh.position); dir.y = 0; dir.normalize();
        tdProjectiles.push({ pos: m.mesh.position.clone(), vel: dir.multiplyScalar(6), life: 3 });
      }
    } else {
      m.mesh.position.y = m.baseY + Math.sin(m.phase * 2) * 0.25; m.mesh.rotation.y += dt * 0.6;
    }
    const d2 = tdPlayer.pos.distanceTo(m.mesh.position);
    if (d2 < 0.95) {
      if (tdPlayer.vel.y < -1 && tdPlayer.pos.y - m.mesh.position.y > 0.35) {
        m.alive = false; m.mesh.visible = false; tdPlayer.vel.y = 6; showMsg3D("¡Lo pisaste!");
      } else if (tdActivePU.invincible > 0) {
        m.alive = false; m.mesh.visible = false;
      } else {
        tdPlayerHurt("¡Un enemigo te atrapó!");
      }
    }
  });

  /* ---------- proyectiles (enemigos y jefe) ---------- */
  for (let i = tdProjectiles.length - 1; i >= 0; i--) {
    const pr = tdProjectiles[i];
    if (!pr.mesh) { pr.mesh = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4d6d })); tdScene.add(pr.mesh); }
    pr.pos.addScaledVector(pr.vel, dt); pr.mesh.position.copy(pr.pos);
    pr.life -= dt;
    if (pr.pos.distanceTo(tdPlayer.pos) < 0.7) { tdPlayerHurt("¡Un disparo te dio!"); pr.life = 0; }
    if (pr.life <= 0) { tdScene.remove(pr.mesh); tdProjectiles.splice(i, 1); }
  }

  /* ---------- 8. persecución ---------- */
  if (tdChase && !tdChase.done) {
    if (!tdChase.mesh) {
      const g = new THREE.Mesh(new THREE.SphereGeometry(1.6, 14, 14), new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 1 }));
      g.visible = false; tdScene.add(g); tdChase.mesh = g;
    }
    if (!tdChase.active && tdPlayer.pos.z < tdChase.startZ - 1) {
      tdChase.active = true; tdChase.mesh.visible = true;
      tdChase.mesh.position.set(tdPlayer.pos.x, tdPlayer.pos.y + 1, tdChase.startZ + 7);
      showMsg3D("¡CORRE! ¡Algo te persigue!");
    }
    if (tdChase.active) {
      tdChase.mesh.position.z -= td3D.chaseSpeed * dt;
      tdChase.mesh.position.x += (tdPlayer.pos.x - tdChase.mesh.position.x) * Math.min(1, dt * 1.2);
      tdChase.mesh.rotation.x -= dt * 4;
      if (tdChase.mesh.position.distanceTo(tdPlayer.pos) < 2) tdPlayerHurt("¡Te alcanzó la roca!");
      if (tdChase.endZ !== null && tdPlayer.pos.z < tdChase.endZ) { tdChase.active = false; tdChase.done = true; tdChase.mesh.visible = false; showMsg3D("¡Lo lograste!"); }
    }
  }

  /* ---------- 10. jefe ---------- */
  updateBoss(dt);
  updateBossHud();
  if (tdGoal && tdGoal.mesh.visible) {
    tdGoal.mesh.rotation.y += dt;
    if (tdPlayer.pos.distanceTo(tdGoal.mesh.position) < 1.6) {
      showMsg3D("¡TORRE 3D COMPLETADA! Cristales: " + tdPlayer.coins + "/" + tdCoinTotalCount);
      exit3D();
    }
  }

  tdPipo.position.set(tdPlayer.pos.x, tdPlayer.pos.y, tdPlayer.pos.z);
  if (tdPlayer.hurtT > 0) { tdPlayer.hurtT -= dt; tdPipo.visible = Math.floor(performance.now() / 90) % 2 === 0; } else { tdPipo.visible = true; }

  const camDist = 6.5, camHeight = 3.2;
  const camTarget = new THREE.Vector3(tdPlayer.pos.x - Math.sin(tdCamYaw) * camDist, tdPlayer.pos.y + camHeight, tdPlayer.pos.z - Math.cos(tdCamYaw) * camDist);
  tdCamera.position.lerp(camTarget, Math.min(1, dt * 6));
  tdCamera.lookAt(tdPlayer.pos.x, tdPlayer.pos.y + 0.6, tdPlayer.pos.z);

  for (let i = tdLaserBeams.length - 1; i >= 0; i--) { tdLaserBeams[i].life -= dt; if (tdLaserBeams[i].life <= 0) { tdScene.remove(tdLaserBeams[i].mesh); tdLaserBeams.splice(i, 1); } }

  const dashBtn = document.getElementById("dashBtn3d");
  if (dashBtn) dashBtn.style.opacity = tdPlayer.dashCd > 0 ? 0.4 : 1;
}
</script>
</body>
</html>
